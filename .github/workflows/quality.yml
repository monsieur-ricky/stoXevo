name: Quality

on:
  push:
    branches: [main, 'improvement/**']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run lint -- --max-warnings=0
      - run: npm test -- --watch=false
      - run: npm run build
